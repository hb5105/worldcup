<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIFA World Cup 2026 Dashboard</title>
  <style>
    :root {
      --bg-dark: #080810;
      --bg-card: rgba(255, 255, 255, 0.03);
      --bg-card-hover: rgba(255, 255, 255, 0.06);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #e8e6e1;
      --text-muted: #6a6a7a;
      --accent-gold: #D4AF37;
      --accent-glow: rgba(212, 175, 55, 0.15);
      --green-live: #2ECC71;
      --red-fail: #E74C3C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #06060b 0%, var(--bg-dark) 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 60px;
      overflow-y: scroll;
    }

    /* Header & Hero Styles */
    header {
      background: linear-gradient(180deg, #130f1a 0%, #080810 100%);
      padding: 24px 16px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
    }

    .subtitle {
      font-size: 11px;
      letter-spacing: 5px;
      color: var(--accent-gold);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 4px;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #fff 40%, var(--accent-gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .meta-bar {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 6px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      display: flex;
      justify-content: center;
      gap: 12px;
      align-items: center;
    }

    /* Countdown Banner */
    #countdown-container {
      background: rgba(212, 175, 55, 0.05);
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
      padding: 8px 16px;
      text-align: center;
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--accent-gold);
      font-weight: 600;
    }

    /* App Container */
    .app-width {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 12px;
    }

    /* Search & Controls */
    .controls-wrapper {
      margin: 14px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-bar-container {
      position: relative;
    }

    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-gold);
      background: rgba(255, 255, 255, 0.07);
    }

    /* View Switcher */
    .tabs-nav {
      display: flex;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab-btn.active {
      background: var(--accent-glow);
      color: var(--accent-gold);
      border-bottom: 2px solid var(--accent-gold);
    }

    /* Horizontal Date Strip Selector */
    .date-strip-outer {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #06060b;
      padding: 10px 0;
      margin-bottom: 8px;
    }

    .date-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .date-strip::-webkit-scrollbar { display: none; }

    .date-card {
      flex: 0 0 auto;
      min-width: 58px;
      padding: 6px 4px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 2px solid transparent;
      color: #bbb;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .date-card.active {
      border-color: var(--accent-gold);
      background: var(--accent-glow);
      color: var(--accent-gold);
    }
    .date-card.today {
      border-color: rgba(212, 175, 55, 0.4);
    }
    .date-card .day-lbl { font-size: 8px; font-weight: 700; text-transform: uppercase; }
    .date-card .day-num { font-size: 18px; font-weight: 800; line-height: 1.1; margin: 1px 0; }
    .date-card .mo-lbl { font-size: 7px; color: #777; letter-spacing: 0.5px; }
    .date-card.active .mo-lbl { color: var(--accent-gold); }
    .date-card .cnt-badge { font-size: 7px; background: rgba(255,255,255,0.06); padding: 1px 3px; border-radius: 4px; margin-top: 3px; display: inline-block; }

    /* Group Filters Strip */
    .filter-strip {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 4px 0 12px;
    }
    .filter-strip::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex: 0 0 auto;
      padding: 5px 11px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      color: #777;
      border: none;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-chip.active {
      background: rgba(212, 175, 55, 0.18);
      color: var(--accent-gold);
    }

    /* Date Divider Header */
    .view-section-header {
      padding: 8px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .view-section-title { font-size: 15px; font-weight: 700; }
    .view-section-subtitle { font-size: 10px; color: var(--text-muted); margin-top: 1px; }

    /* Match Card Grid Structure */
    .match-card {
      background: var(--bg-card);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      border-left: 4px solid transparent;
      border-top: 1px solid rgba(255,255,255,0.01);
      position: relative;
      transition: transform 0.2s, background-color 0.2s;
    }
    .match-card:hover {
      background: var(--bg-card-hover);
    }
    .match-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .match-tag {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .match-time { font-size: 11px; color: var(--accent-gold); font-weight: 700; }
    
    .match-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 0;
    }
    .team-slot {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .team-slot.home { justify-content: flex-end; text-align: right; }
    .team-slot.away { justify-content: flex-start; text-align: left; }
    .team-name { font-size: 13px; font-weight: 700; color: #fff; }
    .flag { font-size: 18px; line-height: 1; }
    
    /* Score Input Custom Styling */
    .score-input {
      width: 32px;
      height: 32px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      text-align: center;
      color: var(--accent-gold);
      font-weight: 800;
      font-size: 14px;
      outline: none;
    }
    .score-input:focus { border-color: var(--accent-gold); background: rgba(0,0,0,0.5); }
    .score-input::placeholder { color: #333; font-weight: 400; }
    .vs-divider { font-size: 9px; color: #444; font-weight: 800; width: 20px; text-align: center; }

    .match-footer {
      text-align: center;
      font-size: 9px;
      color: var(--text-muted);
      margin-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.02);
      padding-top: 6px;
    }

    /* Groups View Tables */
    .group-card {
      border: 1px solid var(--border-color);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.01);
      margin-bottom: 12px;
      overflow: hidden;
    }
    .group-header {
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border-color);
    }
    .group-badge {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 13px;
    }
    .group-title { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
    
    .table-row {
      display: grid;
      grid-template-columns: 24px 1fr repeat(6, 28px);
      font-size: 11px;
      padding: 8px 10px;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.02);
    }
    .table-row.th {
      font-size: 8px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(255,255,255,0.005);
      border-bottom: 1px solid var(--border-color);
    }
    .table-row:last-child { border-bottom: none; }
    .cell-center { text-align: center; }
    .cell-bold { font-weight: 800; }
    .cell-team { display: flex; align-items: center; gap: 6px; font-weight: 600; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    .pos-num { font-size: 9px; color: var(--text-muted); font-weight: 700; text-align: center; }
    .qualify-marker { width: 3px; height: 14px; border-radius: 2px; display: inline-block; }

    /* Summary Stats Footer Module */
    .summary-bar {
      margin-top: 20px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(212, 175, 55, 0.02);
      border: 1px solid rgba(212, 175, 55, 0.08);
      display: flex;
      justify-content: space-around;
      text-align: center;
    }
    .stat-val { font-size: 18px; font-weight: 800; color: var(--accent-gold); }
    .stat-lbl { font-size: 8px; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; margin-top: 1px; }

    .timezone-toggle {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 8px;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .timezone-toggle.active {
      color: var(--accent-gold);
      border-color: var(--accent-gold);
    }
  </style>
</head>

    const FL = {
      "Mexico":"🇲🇽","South Africa":"🇿🇦","South Korea":"🇰🇷","Czechia":"🇨🇿",
      "Canada":"🇨🇦","Bosnia & Herzegovina":"🇧🇦","United States":"🇺🇸","Paraguay":"🇵🇾",
      "Qatar":"🇶🇦","Switzerland":"🇨🇭","Brazil":"🇧🇷","Morocco":"🇲🇦",

      "Germany":"🇩🇪","Curaçao":"🇨🇼","Netherlands":"🇳🇱","Japan":"🇯🇵",

      "France":"🇫🇷","Senegal":"🇸🇳","Iraq":"🇮🇶","Norway":"🇳🇴",
      "Argentina":"🇦🇷","Algeria":"🇩🇿","Austria":"🇦🇹","Jordan":"🇯🇴",
      "Portugal":"🇵🇹","Congo DR":"🇨🇩","England":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","Croatia":"🇭🇷",
      "Ghana":"🇬🇭","Panama":"🇵🇦","Uzbekistan":"🇺🇿","Colombia":"🇨🇴","TBD":"⬜"
    };

    // --- APPLICATION STATE ENGINE ---
    let currentView = 'schedule';
    let selectedDate = "2026-06-11";
    let selectedGroupFilter = 'ALL';
    let searchQuery = '';
    let useLocalTimezone = false;
    let scoresDB = {}; // Format: { matchId: { hScore: X, aScore: Y } }

    // --- INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
      loadSavedData();
      buildDateStrip();
      buildGroupFilterStrip();
      initializeCountdown();
      renderApp();
    });

    function loadSavedData() {
      const saved = localStorage.getItem('wc2026_scores');
      if (saved) {
        try { scoresDB = JSON.parse(saved); } catch(e) { scoresDB = {}; }
      }
      const tzPref = localStorage.getItem('wc2026_tz_local');
      useLocalTimezone = tzPref === 'true';
      updateTimezoneButtonUI();
    }

    function saveScore(matchId, homeVal, awayVal) {
      if (homeVal === '' || awayVal === '') {
        delete scoresDB[matchId];
      } else {
        scoresDB[matchId] = {
          hScore: parseInt(homeVal, 10),
          aScore: parseInt(awayVal, 10)
        };
      }
      localStorage.setItem('wc2026_scores', JSON.stringify(scoresDB));
      updateSummaryStats();
      if (currentView === 'groups') {
        renderGroupsView();
      } else {
        updateDateBadges();
      }
    }

    // --- COUNTDOWN GENERATOR ---
    function initializeCountdown() {
      const kickoff = new Date("2026-06-11T12:00:00-08:00"); // PST Launch
      function updateClock() {
        const now = new Date();
        const diff = kickoff - now;
        const el = document.getElementById('countdown-container');
        if (diff <= 0) {
          el.innerText = "⚽ TOURNAMENT IS LIVE NOW!";
          el.style.background = "rgba(46, 204, 113, 0.1)";
          el.style.color = "var(--green-live)";
          return;
        }
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((diff % (1000 * 60)) / 1000);
        el.innerText = `⏳ ${days}d ${hours}h ${mins}m ${secs}s UNTIL KICKOFF (MEXICO CITY)`;
      }
      updateClock();
      setInterval(updateClock, 1000);
    }

    // --- TIMEZONE UTILITY CONFIGS ---
    document.getElementById('tz-toggle-btn').addEventListener('click', () => {
      useLocalTimezone = !useLocalTimezone;
      localStorage.setItem('wc2026_tz_local', useLocalTimezone);
      updateTimezoneButtonUI();
      renderApp();
    });

    function updateTimezoneButtonUI() {
      const btn = document.getElementById('tz-toggle-btn');
      if (useLocalTimezone) {
        btn.innerText = "Local Time";
        btn.classList.add('active');
      } else {
        btn.innerText = "PST Time";
        btn.classList.add('active');
      }
    }

    function parseToDisplayTime(dateStr, timeStr) {
      if (!useLocalTimezone) return `${timeStr} PST`;
      // Convert standard ISO + PST time template string straight into Local Browser Time
      const dt = new Date(`${dateStr}T${convertTo24h(timeStr)}:00-08:00`);
      return dt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function convertTo24h(timeStr) {
      const [time, modifier] = timeStr.split(' ');
      let [hours, minutes] = time.split(':');
      if (hours === '12') hours = '00';
      if (modifier === 'PM') hours = parseInt(hours, 10) + 12;
      return `${String(hours).padStart(2, '0')}:${minutes}`;
    }

    // --- DOM BUILDERS ---
    function buildDateStrip() {
      const target = document.getElementById('date-strip-target');
      const uniqueDates = [...new Set(MATCHES.map(m => m.d))].sort();
      target.innerHTML = '';
      
      uniqueDates.forEach(date => {
        const dObj = new Date(date + "T12:00:00");
        const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
        const mos = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG"];
        
        const card = document.createElement('div');
        card.className = `date-card ${date === selectedDate ? 'active' : ''}`;
        card.id = `date-card-${date}`;
        card.onclick = () => handleDateSelect(date);

        card.innerHTML = `
          <div class="day-lbl">${days[dObj.getDay()]}</div>
          <div class="day-num">${dObj.getDate()}</div>
          <div class="mo-lbl">${mos[dObj.getMonth()]}</div>
          <div class="cnt-badge" id="badge-${date}">0</div>
        `;
        target.appendChild(card);
      });
      updateDateBadges();
    }

    function updateDateBadges() {
      const uniqueDates = [...new Set(MATCHES.map(m => m.d))];
      uniqueDates.forEach(date => {
        const count = MATCHES.filter(m => m.d === date).length;
        const badge = document.getElementById(`badge-${date}`);
        if (badge) badge.innerText = count;
      });
    }

    function buildGroupFilterStrip() {
      const target = document.getElementById('group-filter-target');
      const filters = ['ALL', ...Object.keys(GROUPS), 'R32', 'R16', 'QF', 'SF', '3RD', 'F'];
      target.innerHTML = '';
      
      filters.forEach(f => {
        const chip = document.createElement('button');
        chip.className = `filter-chip ${f === selectedGroupFilter ? 'active' : ''}`;
        chip.innerText = PL[f] ? PL[f].toUpperCase() : `GROUP ${f}`;
        if (f === 'ALL') chip.innerText = 'ALL MATCHES';
        chip.onclick = () => handleGroupFilterSelect(f);
        target.appendChild(chip);
      });
    }

    // --- CONTROLLER FUNCTIONS ---
    function switchView(viewName) {
      currentView = viewName;
      document.getElementById('tab-sched').classList.toggle('active', viewName === 'schedule');
      document.getElementById('tab-groups').classList.toggle('active', viewName === 'groups');
      document.getElementById('view-container-schedule').style.display = viewName === 'schedule' ? 'block' : 'none';
      document.getElementById('view-container-groups').style.display = viewName === 'groups' ? 'block' : 'none';
      
      document.getElementById('view-title-main').innerText = viewName === 'schedule' ? 'Match Schedule' : 'Group Standings';
      renderApp();
    }

    function handleDateSelect(date) {
      selectedDate = date;
      document.querySelectorAll('.date-card').forEach(c => c.classList.remove('active'));
      document.getElementById(`date-card-${date}`).classList.add('active');
      renderApp();
    }

    function handleGroupFilterSelect(filterVal) {
      selectedGroupFilter = filterVal;
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      renderApp();
    }

    function handleSearch() {
      searchQuery = document.getElementById('app-search').value.toLowerCase();
      renderApp();
    }

    function updateSummaryStats() {
      const total = MATCHES.length;
      const played = Object.keys(scoresDB).length;
      document.getElementById('stat-tot').innerText = total;
      document.getElementById('stat-played').innerText = played;
      document.getElementById('stat-rem').innerText = (total - played);
    }

    // --- CORE RENDERING ENGINE ---
    function renderApp() {
      updateSummaryStats();
      if (currentView === 'schedule') {
        renderScheduleView();
      } else {
        renderGroupsView();
      }
    }

    function renderScheduleView() {
      const target = document.getElementById('matches-target');
      target.innerHTML = '';

      // Logic overrides: If search is active, ignore absolute date tabs to present structural global results
      let filtered = MATCHES;
      
      if (searchQuery) {
        filtered = filtered.filter(m => 
          m.h.toLowerCase().includes(searchQuery) ||
          m.a.toLowerCase().includes(searchQuery) ||
          m.v.toLowerCase().includes(searchQuery) ||
          m.g.toLowerCase().includes(searchQuery)
        );
        document.getElementById('section-date-title').innerText = `Search Matrix Results`;
        document.getElementById('section-date-meta').innerText = `${filtered.length} matches discovered matching context`;
      } else {
        filtered = filtered.filter(m => m.d === selectedDate);
        if (selectedGroupFilter !== 'ALL') {
          filtered = filtered.filter(m => m.g === selectedGroupFilter);
        }
        const dObj = new Date(selectedDate + "T12:00:00");
        document.getElementById('section-date-title').innerText = dObj.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        document.getElementById('section-date-meta').innerText = `${filtered.length} matches scheduled for this frame selection`;
      }

      if(filtered.length === 0) {
        target.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted); font-size:13px;">No tournament matches found matching active query params.</div>`;
        return;
      }

      filtered.forEach(m => {
        const card = document.createElement('div');
        const color = GC[m.g] || '#fff';
        card.className = 'match-card';
        card.style.borderLeftColor = color;

        const savedMatch = scoresDB[m.id] || {hScore: '', aScore: ''};
        const labelText = PL[m.g] ? PL[m.g] : `GROUP ${m.g}`;

        card.innerHTML = `
          <div class="match-header">
            <span class="match-tag" style="background:${color}15; color:${color};">${labelText}</span>
            <span class="match-time">${parseToDisplayTime(m.d, m.t)}</span>
          </div>
          <div class="match-main">
            <div class="team-slot home">
              <span class="team-name">${m.h}</span>
              <span class="flag">${FL[m.h] || '⬜'}</span>
            </div>
            <input type="number" min="0" class="score-input" value="${savedMatch.hScore}" placeholder="-" oninput="saveScore(${m.id}, this.value, this.nextElementSibling.nextElementSibling.value)">
            <div class="vs-divider">vs</div>
            <input type="number" min="0" class="score-input" value="${savedMatch.aScore}" placeholder="-" oninput="saveScore(${m.id}, this.previousElementSibling.previousElementSibling.value, this.value)">
            <div class="team-slot away">
              <span class="flag">${FL[m.a] || '⬜'}</span>
              <span class="team-name">${m.a}</span>
            </div>
          </div>
          <div class="match-footer">📍 ${m.v} • Date: ${m.d}</div>
        `;
        target.appendChild(card);
      });
    }

    // --- MATHEMATICAL STANDINGS PROCESSING ENGINE ---
    function renderGroupsView() {
      const target = document.getElementById('groups-target');
      target.innerHTML = '';

      Object.keys(GROUPS).forEach(gk => {
        const group = GROUPS[gk];
        const color = GC[gk];

        // Initialize transient dynamic calculation structure
        let matrix = {};
        group.teams.forEach(t => { matrix[t] = { name: t, mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 }; });

        // Calculate current group matches inside DB
        const groupMatches = MATCHES.filter(m => m.g === gk);
        groupMatches.forEach(m => {
          if (scoresDB[m.id]) {
            const h = m.h;
            const a = m.a;
            const hs = scoresDB[m.id].hScore;
            const as = scoresDB[m.id].aScore;

            matrix[h].mp++;
            matrix[a].mp++;
            matrix[h].gf += hs;
            matrix[h].ga += as;
            matrix[a].gf += as;
            matrix[a].ga += hs;

            if (hs > as) {
              matrix[h].w++; matrix[h].pts += 3;
              matrix[a].l++;
            } else if (as > hs) {
              matrix[a].w++; matrix[a].pts += 3;
              matrix[h].l++;
            } else {
              matrix[h].d++; matrix[h].pts += 1;
              matrix[a].d++; matrix[a].pts += 1;
            }
            matrix[h].gd = matrix[h].gf - matrix[h].ga;
            matrix[a].gd = matrix[a].gf - matrix[a].ga;
          }
        });

        // Convert lookup table array and compute tournament standard sorts (Points -> GD -> GF)
        let sorted = Object.values(matrix).sort((x, y) => {
          if (y.pts !== x.pts) return y.pts - x.pts;
          if (y.gd !== x.gd) return y.gd - x.gd;
          return y.gf - x.gf;
        });

        // HTML Output UI rendering
        const gCard = document.createElement('div');
        gCard.className = 'group-card';
        
        let rowsHtml = '';
        sorted.forEach((row, idx) => {
          const qColor = idx < 2 ? color : 'transparent';
          rowsHtml += `
            <div class="table-row">
              <span class="pos-num">${idx + 1}</span>
              <div class="cell-team">
                <span class="qualify-marker" style="background:${qColor};"></span>
                <span class="flag">${FL[row.name] || '🏳️'}</span>
                <span>${row.name}</span>
              </div>
              <span class="cell-center">${row.mp}</span>
              <span class="cell-center" style="color:var(--green-live);">${row.w}</span>
              <span class="cell-center" style="color:var(--text-muted);">${row.d}</span>
              <span class="cell-center" style="color:var(--red-fail);">${row.l}</span>
              <span class="cell-center ${row.gd > 0 ? 'cell-bold' : ''}" style="color:${row.gd > 0 ? 'var(--green-live)' : row.gd < 0 ? 'var(--red-fail)' : 'var(--text-muted)'}">${row.gd > 0 ? '+' : ''}${row.gd}</span>
              <span class="cell-center cell-bold" style="color:${color}; font-size:12px;">${row.pts}</span>
            </div>
          `;
        });

        gCard.innerHTML = `
          <div class="group-header">
            <div class="group-badge" style="background:${color}15; color:${color}; border:1px solid ${color}44;">${gk}</div>
            <div class="group-title">Group ${gk} Table Standings</div>
          </div>
          <div class="table-row th">
            <span>Pos</span><span>Team</span><span class="cell-center">MP</span><span class="cell-center">W</span><span class="cell-center">D</span><span class="cell-center">L</span><span class="cell-center">GD</span><span class="cell-center">Pts</span>
          </div>
          ${rowsHtml}
        `;
        target.appendChild(gCard);
      });
    }
  </script>
