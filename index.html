<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FIFA World Cup 2026™ Hub</title>
  <style>
    :root {
      --bg-base: #000000;
      --bg-surface: rgba(28, 28, 30, 0.7);
      --bg-card: rgba(44, 44, 46, 0.6);
      --border-light: rgba(255, 255, 255, 0.1);
      --text-main: #ffffff;
      --text-secondary: rgba(235, 235, 245, 0.6);
      --text-tertiary: rgba(235, 235, 245, 0.3);
      --accent: #FF3B30;
      --accent-glow: rgba(255, 59, 48, 0.15);
      --gold: #D4AF37;
      --gold-glow: rgba(212, 175, 55, 0.15);
      --nav-height: 84px;
      
      /* Typography */
      --font-stack: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-stack); -webkit-tap-highlight-color: transparent; }
    
    body { 
      background-color: var(--bg-base); 
      background-image: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.1) 0%, rgba(0,0,0,0) 60%);
      color: var(--text-main); 
      padding-bottom: calc(var(--nav-height) + 30px); 
      -webkit-font-smoothing: antialiased; 
      min-height: 100vh;
    }

    /* Core UI Components */
    .glass-panel {
      background: var(--bg-surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-light);
    }

    /* Header */
    header {
      position: sticky; top: 0; z-index: 100;
      padding: env(safe-area-inset-top) 20px 16px;
      display: flex; justify-content: space-between; align-items: flex-end;
      border-bottom: 1px solid transparent;
      transition: background 0.3s, border-color 0.3s;
    }
    header.scrolled {
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border-light);
    }
    
    .header-titles p { font-size: 13px; font-weight: 600; color: var(--gold); letter-spacing: 0.5px; margin-bottom: 4px; text-transform: uppercase; }
    .header-titles h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; line-height: 1; }
    
    .live-indicator { display: flex; align-items: center; gap: 6px; background: rgba(50, 215, 75, 0.15); padding: 6px 12px; border-radius: 20px; }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #32d74b; box-shadow: 0 0 8px #32d74b; animation: pulse 2s infinite; }
    .live-txt { font-size: 11px; font-weight: 700; color: #32d74b; text-transform: uppercase; letter-spacing: 0.5px; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.2); } }

    /* App Container & Views */
    .container { max-width: 600px; margin: 0 auto; padding: 16px 20px; }
    .view-section { display: none; opacity: 0; transition: opacity 0.3s ease; }
    .view-section.active { display: block; opacity: 1; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Calendar Header Trigger */
    .calendar-trigger {
      width: 100%; border: none; outline: none; padding: 16px; border-radius: 16px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; cursor: pointer; transition: transform 0.2s;
    }
    .calendar-trigger:active { transform: scale(0.98); }
    .cal-title-wrapper { display: flex; flex-direction: column; align-items: flex-start; }
    .cal-subtitle { font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 2px; }
    .cal-title { font-size: 18px; font-weight: 700; color: var(--text-main); }
    .cal-icon { width: 32px; height: 32px; border-radius: 10px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 14px; transition: transform 0.3s; }
    .cal-icon.open { transform: rotate(180deg); }

    /* iOS Calendar Grid System */
    .calendar-dropdown { overflow: hidden; max-height: 0; transition: max-height 0.5s cubic-bezier(0.16, 1, 0.3, 1); margin-bottom: 0; }
    .calendar-dropdown.open { max-height: 800px; margin-bottom: 24px; }
    
    .cal-month-header { font-size: 20px; font-weight: 700; margin: 0 0 12px 8px; letter-spacing: -0.3px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-bottom: 24px; }
    .cal-day-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); padding-bottom: 8px; }
    
    .cal-cell { 
      aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 500; cursor: pointer; border-radius: 50%;
      position: relative; transition: all 0.2s;
    }
    .cal-cell:active { background: rgba(255,255,255,0.1); }
    .cal-cell.has-match::after { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--text-secondary); position: absolute; bottom: 6px; }
    .cal-cell.today { background: var(--accent); color: white; font-weight: 700; }
    .cal-cell.today::after { background: white; }
    .cal-cell.past { color: var(--text-tertiary); }
    .cal-cell.past::after { background: var(--text-tertiary); }
    .cal-cell.selected:not(.today) { background: var(--text-main); color: black; font-weight: 700; }
    .cal-cell.selected:not(.today)::after { background: black; }

    /* Search Bar */
    .search-wrapper { position: relative; margin-bottom: 20px; }
    .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 16px; opacity: 0.5; }
    .search-input {
      width: 100%; background: rgba(255,255,255,0.08); border: none;
      color: var(--text-main); padding: 14px 16px 14px 44px; border-radius: 14px; 
      font-size: 16px; font-weight: 500; outline: none; transition: background 0.2s;
    }
    .search-input:focus { background: rgba(255,255,255,0.12); }
    .search-input::placeholder { color: var(--text-secondary); }

    /* Match Cards */
    .card { 
      background: var(--bg-card); border-radius: 20px; padding: 20px; margin-bottom: 16px; 
      transition: transform 0.2s, background 0.2s; position: relative; overflow: hidden;
    }
    .card.clickable { cursor: pointer; }
    .card.clickable:active { transform: scale(0.97); background: rgba(255,255,255,0.08); }
    
    .match-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .match-group { font-size: 12px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
    .match-status { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 8px; background: rgba(255,255,255,0.1); color: var(--text-main); }
    .match-status.live { background: var(--accent-glow); color: var(--accent); }

    .team-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .team-row:last-of-type { margin-bottom: 0; }
    
    .team-info { display: flex; align-items: center; gap: 12px; }
    .flag-wrap { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); font-size: 20px; }
    .team-name { font-size: 18px; font-weight: 600; }
    
    .score-wrap { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .score-wrap.live { color: var(--gold); }

    /* Interactive Match Panel (Simulator) */
    .match-panel { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; opacity: 0; }
    .match-panel.active { max-height: 200px; opacity: 1; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-light); }
    
    .sim-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-sim { 
      background: rgba(255,255,255,0.1); border: none; color: var(--text-main); 
      font-size: 13px; font-weight: 600; padding: 12px; border-radius: 10px; cursor: pointer; 
    }
    .btn-sim.full { grid-column: span 2; background: var(--gold-glow); color: var(--gold); }
    .btn-sim:active { background: rgba(255,255,255,0.2); }

    /* Segmented Control (Tabs) */
    .segmented-control { display: flex; background: rgba(255,255,255,0.08); padding: 4px; border-radius: 12px; margin-bottom: 24px; }
    .seg-btn { flex: 1; padding: 10px; font-size: 14px; font-weight: 600; color: var(--text-secondary); background: transparent; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .seg-btn.active { background: rgba(255,255,255,0.15); color: var(--text-main); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

    /* Standings Table */
    .standings-card { background: var(--bg-card); border-radius: 20px; padding: 20px 0; margin-bottom: 20px; }
    .standings-header { padding: 0 20px 16px; font-size: 18px; font-weight: 700; border-bottom: 1px solid var(--border-light); margin-bottom: 8px; }
    
    .table-row { display: grid; grid-template-columns: 28px 1fr repeat(4, 32px); gap: 4px; padding: 12px 20px; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .table-row:last-child { border-bottom: none; }
    .th { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; padding: 0 20px 8px; border-bottom: none; }
    
    .pos { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
    .team-cell { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; }
    .qualify-line { width: 3px; height: 16px; border-radius: 2px; }
    .qualify-line.active { background: var(--gold); }
    
    .stat-cell { text-align: center; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .stat-pts { font-weight: 700; color: var(--text-main); font-size: 15px; }

    /* Bracket UI */
    .bracket-stage { margin-bottom: 32px; }
    .bracket-label { font-size: 14px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; padding-left: 4px; }
    .bracket-node { background: var(--bg-card); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .bracket-team { display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: 600; margin-bottom: 12px; }
    .bracket-team:last-child { margin-bottom: 0; }
    .bracket-team.winner { color: var(--gold); }

    /* Bottom Navigation Tab Bar */
    .tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-height);
      background: rgba(18, 18, 18, 0.85); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--border-light); display: flex; justify-content: space-around; padding-bottom: env(safe-area-inset-bottom);
      z-index: 200;
    }
    .tab-item { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 33.33%; color: var(--text-secondary); cursor: pointer; transition: color 0.2s; }
    .tab-item.active { color: var(--text-main); }
    .tab-icon { font-size: 24px; margin-bottom: 4px; filter: grayscale(100%) opacity(0.7); transition: 0.2s; }
    .tab-item.active .tab-icon { filter: grayscale(0%) opacity(1); transform: scale(1.1); }
    .tab-label { font-size: 11px; font-weight: 600; }
  </style>
</head>
<body>

  <header id="main-header">
    <div class="header-titles">
      <p>World Cup 2026™</p>
      <h1>Match Hub</h1>
    </div>
    <div class="live-indicator">
      <div class="live-dot" id="live-dot"></div>
      <span class="live-txt" id="live-txt">Predictor Mode</span>
    </div>
  </header>

  <div class="container">
    
    <div id="view-schedule" class="view-section active">
      
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" class="search-input" placeholder="Search teams, groups..." oninput="handleSearch()">
      </div>

      <button class="glass-panel calendar-trigger" onclick="toggleCalendar()">
        <div class="cal-title-wrapper">
          <span class="cal-subtitle">Selected Date</span>
          <span class="cal-title" id="cal-selected-label">Loading...</span>
        </div>
        <div class="cal-icon" id="cal-arrow">▼</div>
      </button>
      
      <div class="calendar-dropdown" id="calendar-dropdown">
        <div id="calendar-grid-target"></div>
      </div>

      <div id="schedule-feed-target"></div>
    </div>

    <div id="view-tournament" class="view-section">
      <div class="segmented-control">
        <button id="btn-groups" class="seg-btn active" onclick="switchTourneyView('groups')">Groups</button>
        <button id="btn-bracket" class="seg-btn" onclick="switchTourneyView('bracket')">Knockouts</button>
      </div>
      <div id="groups-target"></div>
      <div id="bracket-target" style="display:none;"></div>
    </div>

  </div>

  <nav class="tab-bar">
    <div class="tab-item active" onclick="switchMainTab('schedule', this)">
      <span class="tab-icon">📅</span>
      <span class="tab-label">Matches</span>
    </div>
    <div class="tab-item" onclick="switchMainTab('tournament', this)">
      <span class="tab-icon">🏆</span>
      <span class="tab-label">Tournament</span>
    </div>
  </nav>

  <script>
    // --- DATABASE (Optimized core map for speed) ---
    const MATCHES_RAW = [
      {d:"2026-06-11",t:"12:00 PM",g:"A",h:"Mexico",a:"South Africa",v:"Mexico City"},
      {d:"2026-06-11",t:"7:00 PM",g:"A",h:"South Korea",a:"Czechia",v:"Guadalajara"},
      {d:"2026-06-12",t:"12:00 PM",g:"B",h:"Canada",a:"Bosnia & Herzegovina",v:"Toronto"},
      {d:"2026-06-12",t:"6:00 PM",g:"D",h:"United States",a:"Paraguay",v:"Los Angeles"},
      {d:"2026-06-13",t:"12:00 PM",g:"B",h:"Qatar",a:"Switzerland",v:"San Francisco Bay"},
      {d:"2026-06-13",t:"3:00 PM",g:"C",h:"Brazil",a:"Morocco",v:"New York/NJ"},
      {d:"2026-06-14",t:"10:00 AM",g:"E",h:"Germany",a:"Curaçao",v:"Houston"},
      {d:"2026-06-14",t:"1:00 PM",g:"F",h:"Netherlands",a:"Japan",v:"Dallas"},
      // Knockout Placeholders
      {d:"2026-06-28",t:"12:00 PM",g:"R32",h:"1st Group A",a:"2nd Group B",v:"Los Angeles"},
      {d:"2026-07-09",t:"1:00 PM",g:"QF",h:"Winner R16 1",a:"Winner R16 2",v:"Boston"},
      {d:"2026-07-14",t:"12:00 PM",g:"SF",h:"Winner QF 1",a:"Winner QF 2",v:"Dallas"},
      {d:"2026-07-19",t:"12:00 PM",g:"FINAL",h:"Winner SF 1",a:"Winner SF 2",v:"New York/NJ"}
    ];
    const MATCHES = MATCHES_RAW.map((m, i) => ({ id: i + 1, ...m }));

    const GROUPS = {
      A:["Mexico","South Korea","South Africa","Czechia"],
      B:["Canada","Switzerland","Qatar","Bosnia & Herzegovina"],
      C:["Brazil","Morocco","Scotland","Haiti"],
      D:["United States","Australia","Paraguay","Türkiye"]
    };

    const FL = {"Mexico":"🇲🇽","South Africa":"🇿🇦","South Korea":"🇰🇷","Czechia":"🇨🇿","Canada":"🇨🇦","Bosnia & Herzegovina":"🇧🇦","United States":"🇺🇸","Paraguay":"🇵🇾","Qatar":"🇶🇦","Switzerland":"🇨🇭","Brazil":"🇧🇷","Morocco":"🇲🇦","Germany":"🇩🇪","Netherlands":"🇳🇱","Japan":"🇯🇵"};

    // --- SYSTEM ARCHITECTURE ---
    let appState = {
      todayStr: new Date().toISOString().split('T')[0],
      selectedDate: '2026-06-11',
      searchQuery: '',
      expandedMatchId: null,
      calOpen: false,
      tourneyView: 'groups',
      matches: {} 
    };

    // Header Scroll Effect
    window.addEventListener('scroll', () => {
      const header = document.getElementById('main-header');
      if(window.scrollY > 10) header.classList.add('scrolled');
      else header.classList.remove('scrolled');
    });

    window.addEventListener('DOMContentLoaded', () => {
      if (appState.todayStr >= '2026-06-11' && appState.todayStr <= '2026-07-19') appState.selectedDate = appState.todayStr;
      
      initDatabase();
      buildiOSCalendar();
      updateCalendarHeader();
      renderSchedule();
      renderGroupsStandings();
      renderBracket();
    });

    function initDatabase() {
      const saved = localStorage.getItem('wc26_engine_v6');
      if (saved) appState.matches = JSON.parse(saved).matches;
      else {
        MATCHES.forEach(m => { appState.matches[m.id] = { id: m.id, hs: null, as: null, status: 'NS' }; });
        saveData();
      }
    }
    function saveData() { localStorage.setItem('wc26_engine_v6', JSON.stringify({ matches: appState.matches })); }

    // --- NAVIGATION ---
    function switchMainTab(tabId, element) {
      document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tab-item').forEach(n => n.classList.remove('active'));
      document.getElementById(`view-${tabId}`).classList.add('active');
      element.classList.add('active');
      window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function switchTourneyView(view) {
      appState.tourneyView = view;
      document.getElementById('btn-groups').classList.toggle('active', view === 'groups');
      document.getElementById('btn-bracket').classList.toggle('active', view === 'bracket');
      document.getElementById('groups-target').style.display = view === 'groups' ? 'block' : 'none';
      document.getElementById('bracket-target').style.display = view === 'bracket' ? 'block' : 'none';
    }

    function handleSearch() {
      appState.searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      appState.expandedMatchId = null; 
      renderSchedule();
    }

    // --- CALENDAR LOGIC ---
    function toggleCalendar() {
      appState.calOpen = !appState.calOpen;
      document.getElementById('calendar-dropdown').classList.toggle('open', appState.calOpen);
      document.getElementById('cal-arrow').classList.toggle('open', appState.calOpen);
    }

    function updateCalendarHeader() {
      const dObj = new Date(appState.selectedDate + "T12:00:00");
      const fmt = dObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
      document.getElementById('cal-selected-label').innerText = appState.selectedDate === appState.todayStr ? `Today, ${fmt}` : fmt;
    }

    function buildiOSCalendar() {
      const target = document.getElementById('calendar-grid-target');
      target.innerHTML = '';
      
      const renderMonth = (monthName, startDayOffset, daysInMonth, datePrefix) => {
        let html = `<div class="cal-month-header">${monthName}</div><div class="cal-grid">`;
        ['S','M','T','W','T','F','S'].forEach(d => html += `<div class="cal-day-label">${d}</div>`);
        
        for(let i=0; i<startDayOffset; i++) html += `<div></div>`;
        
        for(let d=1; d<=daysInMonth; d++) {
          const dStr = `${datePrefix}-${String(d).padStart(2,'0')}`;
          const isToday = dStr === appState.todayStr;
          const isPast = dStr < appState.todayStr;
          const isSelected = dStr === appState.selectedDate;
          const hasMatch = MATCHES.some(m => m.d === dStr);
          
          let classes = `cal-cell`;
          if (isToday) classes += ` today`;
          else if (isPast) classes += ` past`;
          if (isSelected) classes += ` selected`;
          if (hasMatch) classes += ` has-match`;
          
          html += `<div class="${classes}" onclick="selectDate('${dStr}')">${d}</div>`;
        }
        html += `</div>`;
        target.innerHTML += html;
      };

      renderMonth("June 2026", 1, 30, "2026-06"); // June 1 is Monday
      renderMonth("July 2026", 3, 31, "2026-07"); // July 1 is Wednesday
    }

    function selectDate(dateStr) {
      appState.selectedDate = dateStr;
      appState.searchQuery = '';
      document.getElementById('search-input').value = '';
      toggleCalendar();
      buildiOSCalendar(); 
      updateCalendarHeader();
      renderSchedule();
    }

    // --- SCHEDULE RENDERER ---
    function renderSchedule() {
      const target = document.getElementById('schedule-feed-target');
      target.innerHTML = '';
      
      let dataset = MATCHES;
      if (appState.searchQuery) {
        dataset = dataset.filter(m => m.h.toLowerCase().includes(appState.searchQuery) || m.a.toLowerCase().includes(appState.searchQuery));
      } else {
        dataset = dataset.filter(m => m.d === appState.selectedDate);
      }

      if (dataset.length === 0) {
        target.innerHTML = `<div style="text-align:center; padding:40px 0; color:var(--text-secondary); font-size:15px; font-weight:500;">No matches scheduled.</div>`;
        return;
      }

      dataset.forEach(m => {
        const dyn = appState.matches[m.id];
        const isExpanded = appState.expandedMatchId === m.id;
        
        let statusString = m.t;
        let isLiveActive = false;
        if (dyn.status === 'LIVE') { statusString = `LIVE`; isLiveActive = true; }
        if (dyn.status === 'FT') statusString = `FULLTIME`;

        const groupLabel = m.g.length === 1 ? `Group ${m.g}` : m.g;

        const card = document.createElement('div');
        card.className = 'card clickable';
        card.onclick = (e) => {
          if (e.target.tagName === 'BUTTON') return;
          appState.expandedMatchId = isExpanded ? null : m.id;
          renderSchedule();
        };

        card.innerHTML = `
          <div class="match-meta">
            <span class="match-group">${groupLabel}</span>
            <span class="match-status ${isLiveActive ? 'live' : ''}">${statusString}</span>
          </div>
          
          <div class="team-row">
            <div class="team-info">
              <div class="flag-wrap">${FL[m.h]||'🏳️'}</div>
              <span class="team-name">${m.h}</span>
            </div>
            <div class="score-wrap ${isLiveActive?'live':''}">${dyn.hs !== null ? dyn.hs : '-'}</div>
          </div>
          
          <div class="team-row">
            <div class="team-info">
              <div class="flag-wrap">${FL[m.a]||'🏳️'}</div>
              <span class="team-name">${m.a}</span>
            </div>
            <div class="score-wrap ${isLiveActive?'live':''}">${dyn.as !== null ? dyn.as : '-'}</div>
          </div>
          
          <div class="match-panel ${isExpanded ? 'active' : ''}">
             <div class="sim-grid">
                <button class="btn-sim full" onclick="simAction(${m.id}, 'STATE')">Toggle State (Pre / Live / FT)</button>
                <button class="btn-sim" onclick="simAction(${m.id}, 'GOAL_H')">+ Goal ${m.h}</button>
                <button class="btn-sim" onclick="simAction(${m.id}, 'GOAL_A')">+ Goal ${m.a}</button>
             </div>
          </div>
        `;
        target.appendChild(card);
      });
    }

    function simAction(matchId, type) {
      const dyn = appState.matches[matchId];
      if (type === 'STATE') {
        if (dyn.status === 'NS') { dyn.status = 'LIVE'; dyn.hs = 0; dyn.as = 0; }
        else if (dyn.status === 'LIVE') { dyn.status = 'FT'; }
        else if (dyn.status === 'FT') { dyn.status = 'NS'; dyn.hs = null; dyn.as = null; }
      } else {
        if (dyn.status === 'NS' || dyn.status === 'FT') return;
        if (type === 'GOAL_H') dyn.hs++;
        if (type === 'GOAL_A') dyn.as++;
      }
      saveData();
      renderSchedule();
      if(appState.tourneyView === 'groups') renderGroupsStandings();
    }

    // --- STANDINGS TABLE ---
    function renderGroupsStandings() {
      const target = document.getElementById('groups-target');
      target.innerHTML = '';

      Object.keys(GROUPS).forEach(gk => {
        let matrix = {};
        GROUPS[gk].forEach(t => matrix[t] = { n: t, mp:0, w:0, gd:0, pts:0 });

        MATCHES.filter(m => m.g === gk).forEach(m => {
          const dyn = appState.matches[m.id];
          if(dyn && dyn.hs !== null && dyn.as !== null) {
            matrix[m.h].mp++; matrix[m.a].mp++;
            matrix[m.h].gd += (dyn.hs - dyn.as); matrix[m.a].gd += (dyn.as - dyn.hs);
            if(dyn.hs > dyn.as) { matrix[m.h].w++; matrix[m.h].pts += 3; }
            else if(dyn.as > dyn.hs) { matrix[m.a].w++; matrix[m.a].pts += 3; }
            else { matrix[m.h].pts += 1; matrix[m.a].pts += 1; }
          }
        });

        let sorted = Object.values(matrix).sort((a,b) => b.pts - a.pts || b.gd - a.gd);

        let rows = sorted.map((r, i) => `
          <div class="table-row">
            <div class="pos">${i+1}</div>
            <div class="team-cell">
              <div class="qualify-line ${i<2 ? 'active' : ''}"></div>
              <span style="font-size:20px;">${FL[r.n]||'🏳️'}</span> 
              <span>${r.n}</span>
            </div>
            <div class="stat-cell">${r.mp}</div>
            <div class="stat-cell">${r.w}</div>
            <div class="stat-cell">${r.gd>0?'+':''}${r.gd}</div>
            <div class="stat-cell stat-pts">${r.pts}</div>
          </div>
        `).join('');

        target.innerHTML += `
          <div class="standings-card">
            <div class="standings-header">Group ${gk}</div>
            <div class="table-row th">
              <div></div><div>Club</div><div class="stat-cell">P</div><div class="stat-cell">W</div><div class="stat-cell">GD</div><div class="stat-cell">Pts</div>
            </div>
            ${rows}
          </div>
        `;
      });
    }

    // --- BRACKET ENGINE ---
    function renderBracket() {
      const target = document.getElementById('bracket-target');
      
      const buildNode = (match) => {
        if(!match) return '';
        const dyn = appState.matches[match.id];
        const hWin = dyn && dyn.hs > dyn.as;
        const aWin = dyn && dyn.as > dyn.hs;
        
        return `
          <div class="bracket-node">
            <div class="bracket-team ${hWin ? 'winner' : ''}">
              <span>${match.h}</span>
              <span>${dyn && dyn.hs !== null ? dyn.hs : '-'}</span>
            </div>
            <div class="bracket-team ${aWin ? 'winner' : ''}">
              <span>${match.a}</span>
              <span>${dyn && dyn.as !== null ? dyn.as : '-'}</span>
            </div>
          </div>
        `;
      };

      target.innerHTML = `
        <div class="bracket-stage">
          <div class="bracket-label">The Final</div>
          ${buildNode(MATCHES.find(m => m.g === 'FINAL'))}
        </div>
        <div class="bracket-stage">
          <div class="bracket-label">Semifinals</div>
          ${buildNode(MATCHES.find(m => m.g === 'SF'))}
        </div>
        <div class="bracket-stage">
          <div class="bracket-label">Quarterfinals</div>
          ${buildNode(MATCHES.find(m => m.g === 'QF'))}
        </div>
      `;
    }
  </script>
</body>
</html>
