<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>World Cup 2026 Live Hub</title>
  <style>
    :root {
      --bg-base: #0a0b10;
      --bg-surface: #15161e;
      --bg-card: rgba(255, 255, 255, 0.04);
      --border-light: rgba(255, 255, 255, 0.08);
      --text-main: #f0f0f5;
      --text-muted: #8a8b99;
      --accent: #D4AF37;
      --accent-alpha: rgba(212, 175, 55, 0.15);
      --success: #2ECC71;
      --danger: #E74C3C;
      --nav-height: 64px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      padding-bottom: calc(var(--nav-height) + 20px);
      -webkit-font-smoothing: antialiased;
    }

    /* Top Header */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10, 11, 16, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-light);
      padding: 16px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .header-titles h1 { font-size: 20px; font-weight: 800; color: var(--text-main); }
    .header-titles p { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .sync-status { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; padding: 6px 10px; background: var(--bg-card); border-radius: 20px; }
    .sync-indicator { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }
    .sync-indicator.live { background: var(--success); box-shadow: 0 0 8px var(--success); animation: pulse 2s infinite; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    /* App Layout */
    .container { max-width: 600px; margin: 0 auto; padding: 16px; }
    .view-section { display: none; animation: fadeIn 0.3s ease; }
    .view-section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* Cards & Inputs */
    .card { background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .match-row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
    .team { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
    .team.home { justify-content: flex-end; text-align: right; }
    .team.away { justify-content: flex-start; text-align: left; }
    .score-box { display: flex; align-items: center; gap: 8px; background: var(--bg-base); padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border-light); }
    .score-input { width: 28px; height: 32px; background: transparent; border: none; color: var(--accent); font-size: 18px; font-weight: 800; text-align: center; outline: none; }
    .score-input:disabled { color: var(--text-main); }
    
    /* Settings */
    .settings-group { margin-bottom: 24px; }
    .settings-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    select, input[type="text"] { width: 100%; background: var(--bg-base); border: 1px solid var(--border-light); color: var(--text-main); padding: 12px; border-radius: 8px; font-size: 14px; outline: none; margin-bottom: 12px; }
    select:focus, input[type="text"]:focus { border-color: var(--accent); }
    .btn { width: 100%; background: var(--accent-alpha); color: var(--accent); border: 1px solid var(--accent); padding: 12px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s; }
    .btn:active { transform: scale(0.98); }

    /* Tables */
    .table-grid { display: grid; grid-template-columns: 20px 1fr 24px 24px 24px 24px; gap: 8px; font-size: 12px; padding: 10px 0; border-bottom: 1px solid var(--border-light); align-items: center; }
    .table-header { font-size: 9px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; border-bottom: 2px solid var(--border-light); }
    .col-center { text-align: center; }
    .pts { font-weight: 800; color: var(--accent); }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-height);
      background: rgba(21, 22, 30, 0.95); backdrop-filter: blur(10px);
      border-top: 1px solid var(--border-light);
      display: flex; justify-content: space-around; align-items: center; z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: var(--text-muted); text-decoration: none; font-size: 10px; font-weight: 600;
      cursor: pointer; padding: 8px 24px; transition: 0.2s;
    }
    .nav-item.active { color: var(--accent); }
    .nav-icon { font-size: 20px; }
  </style>
</head>
<body>

  <header>
    <div class="header-titles">
      <p>FIFA World Cup 2026</p>
      <h1>Match Hub</h1>
    </div>
    <div class="sync-status" id="sync-status-badge">
      <div class="sync-indicator" id="sync-dot"></div>
      <span id="sync-text">Predictor Mode</span>
    </div>
  </header>

  <div class="container">
    
    <!-- SCHEDULE VIEW -->
    <div id="view-schedule" class="view-section active">
      <div style="margin-bottom: 16px;">
        <input type="text" id="search-input" placeholder="Search matches, teams, groups..." oninput="renderSchedule()">
      </div>
      <div id="schedule-container"></div>
    </div>

    <!-- GROUPS VIEW -->
    <div id="view-groups" class="view-section">
      <div id="groups-container"></div>
    </div>

    <!-- SETTINGS VIEW -->
    <div id="view-settings" class="view-section">
      <div class="card">
        <div class="settings-group">
          <label>Data Source Configuration</label>
          <select id="data-source-select" onchange="toggleApiSettings()">
            <option value="manual">Manual / Predictor Mode (Local)</option>
            <option value="free">worldcup26.ir (Open Source API)</option>
            <option value="apisports">API-Sports (Premium Key Required)</option>
          </select>
        </div>
        
        <div class="settings-group" id="api-key-group" style="display: none;">
          <label>API-Sports Authorization Key</label>
          <input type="text" id="api-key-input" placeholder="Paste your 32-character key here">
        </div>

        <button class="btn" onclick="saveSettingsAndSync()">Save Configuration & Sync Now</button>
      </div>

      <div class="card" style="margin-top: 20px;">
        <div class="settings-group">
          <label>Developer Tools</label>
          <button class="btn" style="background: transparent; border-color: var(--danger); color: var(--danger);" onclick="clearData()">Reset All Local Data</button>
        </div>
      </div>
    </div>

  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('schedule', this)">
      <span class="nav-icon">📅</span><span>Matches</span>
    </div>
    <div class="nav-item" onclick="switchTab('groups', this)">
      <span class="nav-icon">🏆</span><span>Standings</span>
    </div>
    <div class="nav-item" onclick="switchTab('settings', this)">
      <span class="nav-icon">⚙️</span><span>Settings</span>
    </div>
  </nav>

  <script>
    // --- DATABASE BASELINE ---
    const MATCHES = [
      {id:1, d:"2026-06-11", g:"A", h:"Mexico", a:"South Africa", v:"Mexico City", hs:null, as:null},
      {id:2, d:"2026-06-11", g:"A", h:"South Korea", a:"Czechia", v:"Guadalajara", hs:null, as:null},
      {id:3, d:"2026-06-12", g:"B", h:"Canada", a:"Bosnia & Herzegovina", v:"Toronto", hs:null, as:null},
      {id:4, d:"2026-06-12", g:"D", h:"United States", a:"Paraguay", v:"Los Angeles", hs:null, as:null},
      {id:5, d:"2026-06-13", g:"B", h:"Qatar", a:"Switzerland", v:"San Francisco Bay", hs:null, as:null},
      {id:6, d:"2026-06-13", g:"C", h:"Brazil", a:"Morocco", v:"New York/NJ", hs:null, as:null},
      {id:9, d:"2026-06-14", g:"E", h:"Germany", a:"Curaçao", v:"Houston", hs:null, as:null},
      {id:10, d:"2026-06-14", g:"F", h:"Netherlands", a:"Japan", v:"Dallas", hs:null, as:null},
      {id:13, d:"2026-06-15", g:"H", h:"Spain", a:"Cape Verde", v:"Atlanta", hs:null, as:null},
      {id:14, d:"2026-06-15", g:"G", h:"Belgium", a:"Egypt", v:"Seattle", hs:null, as:null},
      {id:17, d:"2026-06-16", g:"I", h:"France", a:"Senegal", v:"New York/NJ", hs:null, as:null},
      {id:19, d:"2026-06-16", g:"J", h:"Argentina", a:"Algeria", v:"Kansas City", hs:null, as:null},
      {id:21, d:"2026-06-17", g:"K", h:"Portugal", a:"Congo DR", v:"Houston", hs:null, as:null},
      {id:22, d:"2026-06-17", g:"L", h:"England", a:"Croatia", v:"Dallas", hs:null, as:null}
    ];

    const GROUPS = {
      A:["Mexico","South Korea","South Africa","Czechia"],
      B:["Canada","Switzerland","Qatar","Bosnia & Herzegovina"],
      C:["Brazil","Morocco","Scotland","Haiti"],
      D:["United States","Australia","Paraguay","Türkiye"],
      E:["Germany","Ecuador","Ivory Coast","Curaçao"],
      F:["Netherlands","Japan","Tunisia","Sweden"],
      G:["Belgium","Iran","Egypt","New Zealand"],
      H:["Spain","Uruguay","Saudi Arabia","Cape Verde"],
      I:["France","Senegal","Norway","Iraq"],
      J:["Argentina","Austria","Algeria","Jordan"],
      K:["Portugal","Colombia","Congo DR","Uzbekistan"],
      L:["England","Croatia","Ghana","Panama"]
    };

    const FL = {"Mexico":"🇲🇽","South Africa":"🇿🇦","South Korea":"🇰🇷","Czechia":"🇨🇿","Canada":"🇨🇦","Bosnia & Herzegovina":"🇧🇦","United States":"🇺🇸","Paraguay":"🇵🇾","Qatar":"🇶🇦","Switzerland":"🇨🇭","Brazil":"🇧🇷","Morocco":"🇲🇦","Germany":"🇩🇪","Curaçao":"🇨🇼","Netherlands":"🇳🇱","Japan":"🇯🇵","Spain":"🇪🇸","Cape Verde":"🇨🇻","Belgium":"🇧🇪","Egypt":"🇪🇬","France":"🇫🇷","Senegal":"🇸🇳","Argentina":"🇦🇷","Algeria":"🇩🇿","Portugal":"🇵🇹","Congo DR":"🇨🇩","England":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","Croatia":"🇭🇷"};

    // --- STATE MANAGEMENT ---
    let appState = {
      source: localStorage.getItem('wc_source') || 'manual',
      apiKey: localStorage.getItem('wc_apikey') || '',
      scores: JSON.parse(localStorage.getItem('wc_scores') || '{}') 
    };

    // --- INITIALIZATION ---
    window.onload = () => {
      document.getElementById('data-source-select').value = appState.source;
      document.getElementById('api-key-input').value = appState.apiKey;
      toggleApiSettings();
      updateSyncUI();
      renderSchedule();
      renderGroups();
      if(appState.source !== 'manual') performDataSync();
    };

    // --- UI CONTROLLERS ---
    function switchTab(tabId, el) {
      document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(`view-${tabId}`).classList.add('active');
      el.classList.add('active');
      if(tabId === 'groups') renderGroups();
    }

    function toggleApiSettings() {
      const src = document.getElementById('data-source-select').value;
      document.getElementById('api-key-group').style.display = src === 'apisports' ? 'block' : 'none';
    }

    // --- DATA SYNC ENGINE ---
    async function saveSettingsAndSync() {
      appState.source = document.getElementById('data-source-select').value;
      appState.apiKey = document.getElementById('api-key-input').value;
      localStorage.setItem('wc_source', appState.source);
      localStorage.setItem('wc_apikey', appState.apiKey);
      
      updateSyncUI();
      if (appState.source === 'manual') {
        renderSchedule(); renderGroups();
        alert("Switched to Predictor Mode. You can now manually enter scores.");
      } else {
        await performDataSync();
      }
    }

    function updateSyncUI() {
      const dot = document.getElementById('sync-dot');
      const text = document.getElementById('sync-text');
      if (appState.source === 'manual') {
        dot.className = 'sync-indicator'; text.innerText = 'Predictor Mode';
      } else {
        dot.className = 'sync-indicator live'; text.innerText = 'Live Sync Active';
      }
    }

    async function performDataSync() {
      const btn = document.querySelector('.btn');
      const ogText = btn.innerText;
      btn.innerText = "Syncing with API...";
      
      try {
        if (appState.source === 'free') {
          // Adapter for worldcup26.ir Open Source API
          const res = await fetch('https://worldcup26.ir/get/games');
          if (!res.ok) throw new Error("Free API unavailable");
          const data = await res.json();
          // Logic mapping to be fully fleshed out as API schemas mature over June 2026
          console.log("Successfully connected to worldcup26.ir", data);
          
        } else if (appState.source === 'apisports') {
          // Adapter for API-Sports Premium Data
          const res = await fetch('https://v3.football.api-sports.io/fixtures?league=1&season=2026', {
            headers: { 'x-apisports-key': appState.apiKey }
          });
          if (!res.ok) throw new Error("API-Sports Auth Failed");
          const data = await res.json();
          console.log("Successfully connected to API-Sports", data);
        }
        
        btn.innerText = "Sync Complete!";
        setTimeout(() => btn.innerText = ogText, 2000);
        
      } catch (err) {
        console.warn('Live API request failed, running graceful fallback to local cache:', err);
        btn.innerText = "Sync Failed (Using Local)";
        setTimeout(() => btn.innerText = ogText, 3000);
      }
    }

    function handleScoreInput(matchId, isHome, val) {
      if (appState.source !== 'manual') return; // Prevent manual edits in Live mode
      if (!appState.scores[matchId]) appState.scores[matchId] = {h: null, a: null};
      if (isHome) appState.scores[matchId].h = val === '' ? null : parseInt(val);
      else appState.scores[matchId].a = val === '' ? null : parseInt(val);
      
      localStorage.setItem('wc_scores', JSON.stringify(appState.scores));
      renderGroups();
    }

    // --- RENDERERS ---
    function renderSchedule() {
      const container = document.getElementById('schedule-container');
      const query = document.getElementById('search-input').value.toLowerCase();
      const isManual = appState.source === 'manual';
      container.innerHTML = '';

      const filtered = MATCHES.filter(m => m.h.toLowerCase().includes(query) || m.a.toLowerCase().includes(query) || m.v.toLowerCase().includes(query));

      filtered.forEach(m => {
        const hScore = appState.scores[m.id]?.h !== undefined && appState.scores[m.id]?.h !== null ? appState.scores[m.id].h : '';
        const aScore = appState.scores[m.id]?.a !== undefined && appState.scores[m.id]?.a !== null ? appState.scores[m.id].a : '';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--text-muted); margin-bottom:8px;">
            <span style="color:var(--accent); font-weight:700;">Group ${m.g}</span>
            <span>📍 ${m.v} • ${m.d}</span>
          </div>
          <div class="match-row">
            <div class="team home"><span style="font-size:16px;">${FL[m.h]||'🏳️'}</span> ${m.h}</div>
            <div class="score-box">
              <input type="number" class="score-input" value="${hScore}" ${!isManual ? 'disabled' : ''} oninput="handleScoreInput(${m.id}, true, this.value)">
              <span style="font-size:10px; color:#555;">VS</span>
              <input type="number" class="score-input" value="${aScore}" ${!isManual ? 'disabled' : ''} oninput="handleScoreInput(${m.id}, false, this.value)">
            </div>
            <div class="team away">${m.a} <span style="font-size:16px;">${FL[m.a]||'🏳️'}</span></div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderGroups() {
      const container = document.getElementById('groups-container');
      container.innerHTML = '';

      Object.keys(GROUPS).forEach(gk => {
        let matrix = {};
        GROUPS[gk].forEach(t => matrix[t] = { n: t, mp:0, w:0, d:0, l:0, gd:0, pts:0 });

        MATCHES.filter(m => m.g === gk).forEach(m => {
          const s = appState.scores[m.id];
          if (s && s.h !== null && s.a !== null) {
            matrix[m.h].mp++; matrix[m.a].mp++;
            matrix[m.h].gd += (s.h - s.a); matrix[m.a].gd += (s.a - s.h);
            if (s.h > s.a) { matrix[m.h].w++; matrix[m.h].pts+=3; matrix[m.a].l++; }
            else if (s.a > s.h) { matrix[m.a].w++; matrix[m.a].pts+=3; matrix[m.h].l++; }
            else { matrix[m.h].d++; matrix[m.a].d++; matrix[m.h].pts+=1; matrix[m.a].pts+=1; }
          }
        });

        let sorted = Object.values(matrix).sort((a,b) => b.pts - a.pts || b.gd - a.gd);

        let rows = sorted.map((r, i) => `
          <div class="table-grid" style="border-bottom:${i===3?'none':'1px solid var(--border-light)'}; background:${i<2?'rgba(212,175,55,0.03)':'transparent'}">
            <div class="col-center" style="font-size:10px; color:var(--text-muted);">${i+1}</div>
            <div style="font-weight:600;">${FL[r.n]||'🏳️'} ${r.n}</div>
            <div class="col-center">${r.mp}</div>
            <div class="col-center" style="color:var(--success);">${r.w}</div>
            <div class="col-center" style="color:${r.gd>0?'var(--success)':r.gd<0?'var(--danger)':'inherit'};">${r.gd>0?'+':''}${r.gd}</div>
            <div class="col-center pts">${r.pts}</div>
          </div>
        `).join('');

        container.innerHTML += `
          <div class="card" style="padding:0; overflow:hidden;">
            <div style="padding:12px 16px; background:rgba(255,255,255,0.02); font-size:13px; font-weight:800; border-bottom:1px solid var(--border-light);">Group ${gk}</div>
            <div class="table-grid table-header" style="padding:8px 16px 4px;">
              <div>#</div><div>Team</div><div class="col-center">MP</div><div class="col-center">W</div><div class="col-center">GD</div><div class="col-center">Pts</div>
            </div>
            <div style="padding:0 16px;">${rows}</div>
          </div>
        `;
      });
    }

    function clearData() {
      if(confirm("Wipe all local testing data and custom scores?")) {
        localStorage.clear();
        location.reload();
      }
    }
  </script>
</body>
</html>
