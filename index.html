<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>World Cup 2026 Live Hub</title>
  <style>
    :root {
      --bg-base: #08090e;
      --bg-surface: #12131a;
      --bg-card: rgba(255, 255, 255, 0.03);
      --bg-card-hover: rgba(255, 255, 255, 0.06);
      --border-light: rgba(255, 255, 255, 0.08);
      --text-main: #f1f1f6;
      --text-muted: #7e808c;
      --accent: #D4AF37;
      --accent-glow: rgba(212, 175, 55, 0.15);
      --success: #2ECC71;
      --danger: #E74C3C;
      --nav-height: 64px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg-base); color: var(--text-main); padding-bottom: calc(var(--nav-height) + 20px); -webkit-font-smoothing: antialiased; }

    /* Header */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(8, 9, 14, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-light); padding: 16px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .header-titles h1 { font-size: 18px; font-weight: 800; }
    .header-titles p { font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
    
    /* App Container */
    .container { max-width: 650px; margin: 0 auto; padding: 12px; }
    .view-section { display: none; }
    .view-section.active { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* Search Bar */
    .search-container { margin-bottom: 12px; }
    .search-input {
      width: 100%; background: var(--bg-surface); border: 1px solid var(--border-light);
      color: var(--text-main); padding: 12px 16px; border-radius: 12px; font-size: 14px; outline: none; transition: 0.2s;
    }
    .search-input:focus { border-color: var(--accent); background: rgba(255,255,255,0.05); }

    /* Horizontal Date Strip */
    .date-strip-wrapper { position: relative; margin-bottom: 16px; }
    .date-strip { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
    .date-strip::-webkit-scrollbar { display: none; }
    .date-card {
      flex: 0 0 auto; min-width: 62px; padding: 8px 6px; border-radius: 12px;
      background: var(--bg-surface); border: 2px solid transparent; color: var(--text-muted);
      cursor: pointer; text-align: center; transition: 0.2s;
    }
    .date-card.active { border-color: var(--accent); background: var(--accent-glow); color: var(--accent); }
    .day-lbl { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .day-num { font-size: 20px; font-weight: 800; line-height: 1.1; margin: 2px 0; color: var(--text-main); }
    .date-card.active .day-num { color: var(--accent); }
    .mo-lbl { font-size: 9px; font-weight: 600; }
    .cnt-badge { font-size: 8px; background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 6px; margin-top: 4px; display: inline-block; font-weight: 700; }

    /* Match Cards & Live Center */
    .card { background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: 16px; padding: 14px; margin-bottom: 10px; transition: border-color 0.2s; }
    .card.clickable { cursor: pointer; }
    .card.clickable:hover { border-color: rgba(212,175,55,0.3); }
    
    .match-row { display: flex; align-items: center; justify-content: space-between; margin: 12px 0; }
    .team { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
    .team.home { justify-content: flex-end; text-align: right; }
    .team.away { justify-content: flex-start; text-align: left; }
    .flag { font-size: 20px; line-height: 1; }

    .score-display { display: flex; align-items: center; gap: 12px; background: var(--bg-base); padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border-light); min-width: 90px; justify-content: center; }
    .score-num { font-size: 20px; font-weight: 900; color: var(--text-main); }
    .score-num.live { color: var(--accent); }

    .status-badge { font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; background: var(--bg-card); color: var(--text-muted); display: inline-block; }
    .status-badge.live { background: rgba(46,204,113,0.15); color: var(--success); }

    /* Expandable Match Center */
    .match-center-panel { border-top: 1px dashed var(--border-light); margin-top: 12px; padding-top: 12px; display: none; }
    .match-center-panel.active { display: block; }
    .timeline-event { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 8px; color: var(--text-main); background: rgba(255,255,255,0.02); padding: 6px 10px; border-radius: 6px; border-left: 2px solid var(--border-light); }
    .event-time { font-weight: 800; color: var(--accent); min-width: 26px; }
    
    /* Simulator Controls */
    .sim-controls { background: var(--bg-base); border: 1px solid var(--border-light); border-radius: 10px; padding: 10px; margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .sim-btn { background: var(--bg-surface); border: 1px solid var(--border-light); color: var(--text-main); font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 6px; cursor: pointer; flex: 1; min-width: 80px; }
    .sim-btn:active { background: rgba(255,255,255,0.08); transform: scale(0.98); }

    /* Tables & Stats */
    .table-grid { display: grid; grid-template-columns: 20px 1fr repeat(4, 30px); gap: 6px; font-size: 12px; padding: 10px 12px; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.02); }
    .table-header { font-size: 9px; text-transform: uppercase; color: var(--text-muted); font-weight: 800; background: rgba(255,255,255,0.01); border-bottom: 1px solid var(--border-light); }
    .col-center { text-align: center; }

    .stats-grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .leaderboard-box { background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .leaderboard-title { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--accent); letter-spacing: 0.5px; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border-light); }
    .leaderboard-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px dashed rgba(255,255,255,0.05); }
    .leaderboard-row:last-child { border-bottom: none; }
    .lead-name { font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .lead-val { font-weight: 800; color: var(--text-main); }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-height);
      background: rgba(18, 19, 26, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--border-light); display: flex; justify-content: space-around; align-items: center; z-index: 200;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); text-decoration: none; font-size: 10px; font-weight: 700; cursor: pointer; width: 25%; height: 100%; justify-content: center; transition: 0.15s; }
    .nav-item.active { color: var(--accent); background: rgba(212,175,55,0.03); }
    .nav-icon { font-size: 20px; }
  </style>
</head>

      I:["France","Senegal","Norway","Iraq"],
      J:["Argentina","Austria","Algeria","Jordan"],
      K:["Portugal","Colombia","Congo DR","Uzbekistan"],
      L:["England","Croatia","Ghana","Panama"]
    };

    const FL = {
      "Mexico":"🇲🇽","South Africa":"🇿🇦","South Korea":"🇰🇷","Czechia":"🇨🇿",
      "Canada":"🇨🇦","Bosnia & Herzegovina":"🇧🇦","United States":"🇺🇸","Paraguay":"🇵🇾",
      "Qatar":"🇶🇦","Switzerland":"🇨🇭","Brazil":"🇧🇷","Morocco":"🇲🇦",
      "Haiti":"🇭🇹","Scotland":"🏴󠁧󠁢󠁳󠁣󠁴󠁿","Australia":"🇦🇺","Türkiye":"🇹🇷",
      "Germany":"🇩🇪","Curaçao":"🇨🇼","Netherlands":"🇳🇱","Japan":"🇯🇵",
      "Ivory Coast":"🇨🇮","Ecuador":"🇪🇨","Tunisia":"🇹🇳","Sweden":"🇸🇪",
      "Spain":"🇪🇸","Cape Verde":"🇨🇻","Belgium":"🇧🇪","Egypt":"🇪🇬",
      "Saudi Arabia":"🇸🇦","Uruguay":"🇺🇾","Iran":"🇮🇷","New Zealand":"🇳🇿",
      "France":"🇫🇷","Senegal":"🇸🇳","Iraq":"🇮🇶","Norway":"🇳🇴",
      "Argentina":"🇦🇷","Algeria":"🇩🇿","Austria":"🇦🇹","Jordan":"🇯🇴",
      "Portugal":"🇵🇹","Congo DR":"🇨🇩","England":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","Croatia":"🇭🇷",
      "Ghana":"🇬🇭","Panama":"🇵🇦","Uzbekistan":"🇺🇿","Colombia":"🇨🇴","TBD":"⬜",
      "2nd Group A":"⬜","2nd Group B":"⬜","Winner C":"⬜","2nd Group F":"⬜",
      "Winner E":"⬜","3rd A/B/C/D/F":"⬜","Winner F":"⬜","2nd Group C":"⬜",
      "2nd Group E":"⬜","2nd Group I":"⬜","Winner I":"⬜","3rd C/D/F/G/H":"⬜",
      "Winner A":"⬜","3rd C/E/F/H/I":"⬜","Winner L":"⬜","3rd E/H/I/J/K":"⬜",
      "Winner G":"⬜","3rd A/E/H/I/J":"⬜","Winner D":"⬜","3rd B/E/F/I/J":"⬜",
      "Winner H":"⬜","2nd Group J":"⬜","2nd Group K":"⬜","2nd Group L":"⬜",
      "Winner B":"⬜","3rd D/E/I/J/L":"⬜","2nd Group D":"⬜","2nd Group G":"⬜",
      "Winner J":"⬜","2nd Group H":"⬜","Winner K":"⬜"
    };

    // --- 2. STATE MANAGEMENT ---
    let appState = {
      selectedDate: '2026-06-11',
      searchQuery: '',
      expandedMatchId: null,
      matches: {} // Stores simulation states, goals, red cards
    };

    window.addEventListener('DOMContentLoaded', () => {
      initDatabase();
      renderDateStrip();
      renderSchedule();
      renderGroupsStandings();
      renderStats();
    });

    function initDatabase() {
      const saved = localStorage.getItem('wc_engine_data_v4');
      if (saved) {
        appState = JSON.parse(saved);
        // Clear search on load
        appState.searchQuery = ''; 
        appState.expandedMatchId = null;
      } else {
        MATCHES.forEach(m => {
          appState.matches[m.id] = { id: m.id, hs: null, as: null, status: 'NS', minute: 0, events: [] };
        });
        saveData();
      }
    }

    function saveData() {
      localStorage.setItem('wc_engine_data_v4', JSON.stringify(appState));
    }

    // --- 3. NAVIGATION & UI COMPONENTS ---
    function switchTab(tabId, element) {
      document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(`view-${tabId}`).classList.add('active');
      element.classList.add('active');
      
      if (tabId === 'groups') renderGroupsStandings();
      if (tabId === 'stats') renderStats();
    }

    function handleSearch() {
      appState.searchQuery = document.getElementById('schedule-search').value.toLowerCase().trim();
      appState.expandedMatchId = null; // Close open panels when searching
      renderSchedule();
    }

    function renderDateStrip() {
      const target = document.getElementById('date-strip-target');
      const uniqueDates = [...new Set(MATCHES.map(m => m.d))].sort();
      target.innerHTML = '';

      uniqueDates.forEach(date => {
        const dObj = new Date(date + "T12:00:00");
        const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
        const mos = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug"];
        const count = MATCHES.filter(m => m.d === date).length;

        const card = document.createElement('div');
        card.className = `date-card ${date === appState.selectedDate ? 'active' : ''}`;
        card.id = `date-${date}`;
        
        card.onclick = () => {
          appState.selectedDate = date;
          document.querySelectorAll('.date-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          
          // Clear search when a date is manually clicked
          document.getElementById('schedule-search').value = '';
          appState.searchQuery = '';
          
          renderSchedule();
        };

        card.innerHTML = `
          <div class="day-lbl">${days[dObj.getDay()]}</div>
          <div class="day-num">${dObj.getDate()}</div>
          <div class="mo-lbl">${mos[dObj.getMonth()]}</div>
          <div class="cnt-badge">${count} Matches</div>
        `;
        target.appendChild(card);
      });
    }

    // --- 4. MATCH SCHEDULE & SIMULATOR ---
    function renderSchedule() {
      const target = document.getElementById('schedule-feed-target');
      const stripWrapper = document.getElementById('date-strip-wrapper');
      const searchStatus = document.getElementById('search-status');
      target.innerHTML = '';

      let dataset = MATCHES;

      // Core Search Logic: Overrides Date Filter
      if (appState.searchQuery) {
        dataset = dataset.filter(m => 
          m.h.toLowerCase().includes(appState.searchQuery) || 
          m.a.toLowerCase().includes(appState.searchQuery) || 
          m.v.toLowerCase().includes(appState.searchQuery) || 
          m.g.toLowerCase().includes(appState.searchQuery) ||
          m.d.includes(appState.searchQuery)
        );
        stripWrapper.style.display = 'none'; // Hide date grid when searching
        searchStatus.style.display = 'block';
        searchStatus.innerText = `Found ${dataset.length} matches for "${appState.searchQuery}"`;
      } else {
        // Normal Date Filter
        dataset = dataset.filter(m => m.d === appState.selectedDate);
        stripWrapper.style.display = 'block'; // Show date grid
        searchStatus.style.display = 'none';
        
        // Ensure date strip aligns correctly
        const activeCard = document.getElementById(`date-${appState.selectedDate}`);
        if(activeCard) activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }

      if (dataset.length === 0) {
        target.innerHTML = `<div style="text-align:center; padding:40px 0; color:var(--text-muted); font-size:13px;">No matches found.</div>`;
        return;
      }

      dataset.forEach(m => {
        const dyn = appState.matches[m.id];
        const isExpanded = appState.expandedMatchId === m.id;
        
        let statusString = m.t;
        let isLiveActive = false;
        if (dyn.status === '1H' || dyn.status === '2H') { statusString = `🟢 Live: ${dyn.minute}'`; isLiveActive = true; }
        if (dyn.status === 'HT') { statusString = `⏸️ Halftime`; isLiveActive = true; }
        if (dyn.status === 'FT') statusString = `Fulltime`;

        const card = document.createElement('div');
        card.className = 'card clickable';
        card.onclick = (e) => {
          if (e.target.tagName === 'BUTTON') return; // Don't collapse if clicking a simulator button
          appState.expandedMatchId = isExpanded ? null : m.id;
          renderSchedule();
        };

        // Determine Match Type Label (Group stage vs Knockouts)
        const matchLabel = m.g.length === 1 ? `Group ${m.g}` : m.g;

        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; font-size:10px; margin-bottom:8px;">
            <span style="font-weight:800; color:var(--accent); text-transform:uppercase;">${matchLabel}</span>
            <span class="status-badge ${isLiveActive ? 'live' : ''}">${statusString}</span>
          </div>
          <div class="match-row">
            <div class="team home">${m.h} <span class="flag">${FL[m.h]||'⬜'}</span></div>
            <div class="score-display">
              <span class="score-num ${isLiveActive?'live':''}">${dyn.hs !== null ? dyn.hs : '-'}</span>
              <span style="font-size:12px; color:#555; font-weight:800;">:</span>
              <span class="score-num ${isLiveActive?'live':''}">${dyn.as !== null ? dyn.as : '-'}</span>
            </div>
            <div class="team away"><span class="flag">${FL[m.a]||'⬜'}</span> ${m.a}</div>
          </div>
          <div style="font-size:10px; color:var(--text-muted); text-align:center;">📍 ${m.v} • ${m.d}</div>
          
          <!-- Expandable Match Center Panel -->
          <div class="match-center-panel ${isExpanded ? 'active' : ''}">
            <div style="font-size:10px; font-weight:800; color:var(--accent); margin-bottom:8px; text-transform:uppercase;">Live Events</div>
            <div id="timeline-${m.id}"></div>
            
            <div class="sim-controls">
              <button class="sim-btn" style="flex-basis:100%; background:var(--accent-glow); color:var(--accent);" onclick="simAction(${m.id}, 'STATE')">Advance Game State (Kickoff / HT / FT)</button>
              <button class="sim-btn" onclick="simAction(${m.id}, 'GOAL_H')">⚽ Home Goal</button>
              <button class="sim-btn" onclick="simAction(${m.id}, 'GOAL_A')">⚽ Away Goal</button>
              <button class="sim-btn" onclick="simAction(${m.id}, 'RED_H')">🟥 Home Red</button>
              <button class="sim-btn" onclick="simAction(${m.id}, 'RED_A')">🟥 Away Red</button>
            </div>
          </div>
        `;
        target.appendChild(card);
        
        if (isExpanded) {
          const tl = document.getElementById(`timeline-${m.id}`);
          if (dyn.events.length === 0) {
            tl.innerHTML = `<div style="font-size:11px; color:var(--text-muted);">No events yet.</div>`;
          } else {
            dyn.events.forEach(e => {
              const icon = e.type === 'red' ? '🟥' : '⚽';
              tl.innerHTML += `<div class="timeline-event"><span class="event-time">${e.min}'</span> <span>${icon} <strong>${e.team === 'H' ? m.h : m.a}</strong>: ${e.detail}</span></div>`;
            });
          }
        }
      });
    }

    function simAction(matchId, type) {
      const dyn = appState.matches[matchId];
      
      if (type === 'STATE') {
        if (dyn.status === 'NS') { dyn.status = '1H'; dyn.minute = 1; dyn.hs = 0; dyn.as = 0; }
        else if (dyn.status === '1H') dyn.status = 'HT';
        else if (dyn.status === 'HT') { dyn.status = '2H'; dyn.minute = 46; }
        else if (dyn.status === '2H') { dyn.status = 'FT'; dyn.minute = 90; }
        else if (dyn.status === 'FT') { 
          if(confirm('Reset this match to Not Started?')) {
            dyn.status = 'NS'; dyn.minute = 0; dyn.hs = null; dyn.as = null; dyn.events = [];
          }
        }
      } else {
        if (dyn.status === 'NS' || dyn.status === 'HT' || dyn.status === 'FT') {
          alert("Match must be Live (1H or 2H) to add goals/cards!"); return;
        }
        
        let min = dyn.minute + Math.floor(Math.random() * 4);
        if (dyn.status === '1H' && min > 45) min = 45;
        if (dyn.status === '2H' && min > 90) min = 90;
        dyn.minute = min;

        if (type === 'GOAL_H') { dyn.hs++; dyn.events.push({min: min, type:'goal', team:'H', detail:'Goal'}); }
        if (type === 'GOAL_A') { dyn.as++; dyn.events.push({min: min, type:'goal', team:'A', detail:'Goal'}); }
        if (type === 'RED_H') dyn.events.push({min: min, type:'red', team:'H', detail:'Red Card'});
        if (type === 'RED_A') dyn.events.push({min: min, type:'red', team:'A', detail:'Red Card'});
      }

      saveData();
      renderSchedule();
    }

    // --- 5. STANDINGS TABLE ---
    function renderGroupsStandings() {
      const target = document.getElementById('groups-container-target');
      target.innerHTML = '';

      Object.keys(GROUPS).forEach(gk => {
        let matrix = {};
        GROUPS[gk].forEach(t => matrix[t] = { n: t, mp:0, w:0, d:0, l:0, gd:0, pts:0 });

        MATCHES.filter(m => m.g === gk).forEach(m => {
          const dyn = appState.matches[m.id];
          if(dyn && dyn.hs !== null && dyn.as !== null) {
            matrix[m.h].mp++; matrix[m.a].mp++;
            matrix[m.h].gd += (dyn.hs - dyn.as); matrix[m.a].gd += (dyn.as - dyn.hs);
            if(dyn.hs > dyn.as) { matrix[m.h].w++; matrix[m.h].pts += 3; matrix[m.a].l++; }
            else if(dyn.as > dyn.hs) { matrix[m.a].w++; matrix[m.a].pts += 3; matrix[m.h].l++; }
            else { matrix[m.h].d++; matrix[m.a].d++; matrix[m.h].pts += 1; matrix[m.a].pts += 1; }
          }
        });

        let sorted = Object.values(matrix).sort((a,b) => b.pts - a.pts || b.gd - a.gd);

        let rows = sorted.map((r, i) => `
          <div class="table-grid" style="background:${i < 2 ? 'rgba(212,175,55,0.03)': 'transparent'};">
            <div style="font-size:10px; color:var(--text-muted); text-align:center; font-weight:800;">${i+1}</div>
            <div style="font-weight:700;">${FL[r.n]||'🏳️'} ${r.n}</div>
            <div class="col-center">${r.mp}</div>
            <div class="col-center" style="color:var(--success); font-weight:700;">${r.w}</div>
            <div class="col-center" style="color:${r.gd>0?'var(--success)':r.gd<0?'var(--danger)':'inherit'}; font-weight:700;">${r.gd>0?'+':''}${r.gd}</div>
            <div class="col-center" style="font-weight:900; color:var(--accent); font-size:14px;">${r.pts}</div>
          </div>
        `).join('');

        target.innerHTML += `
          <div class="card" style="padding:0; overflow:hidden;">
            <div style="padding:14px; background:rgba(255,255,255,0.01); border-bottom:1px solid var(--border-light); font-size:13px; font-weight:800; color:var(--accent);">Group ${gk}</div>
            <div class="table-grid table-header"><div>#</div><div>Team</div><div class="col-center">MP</div><div class="col-center">W</div><div class="col-center">GD</div><div class="col-center">Pts</div></div>
            <div>${rows}</div>
          </div>
        `;
      });
    }

    // --- 6. STATS ENGINE ---
    function renderStats() {
      let redCardsCount = 0;
      let teamGoals = {};
      
      MATCHES.forEach(m => {
        const dyn = appState.matches[m.id];
        if (dyn && dyn.hs !== null && dyn.as !== null) {
          teamGoals[m.h] = (teamGoals[m.h] || 0) + dyn.hs;
          teamGoals[m.a] = (teamGoals[m.a] || 0) + dyn.as;
          dyn.events.forEach(e => { if(e.type === 'red') redCardsCount++; });
        }
      });

      // Sample placeholders for player stats (would be linked to detailed events in production)
      printLeaderboard('lead-scorers', [["Mbappé (FRA)", 3], ["Vinícius Jr. (BRA)", 2], ["Pulisic (USA)", 2], ["Kane (ENG)", 1]]);
      printLeaderboard('lead-assists', [["Griezmann (FRA)", 2], ["Neymar Jr. (BRA)", 2], ["Musiala (GER)", 1], ["Reyna (USA)", 1]]);
      
      const sortedTeams = Object.entries(teamGoals).sort((a,b)=>b[1]-a[1]).slice(0, 4);
      printLeaderboard('lead-teams', sortedTeams);
      
      document.getElementById('lead-disciplinary').innerHTML = `
        <div style="text-align:center; padding:16px 0;">
          <div style="font-size:42px; font-weight:900; color:var(--danger);">${redCardsCount}</div>
          <div style="font-size:11px; text-transform:uppercase; color:var(--text-muted); font-weight:800; margin-top:4px;">Tournament Red Cards</div>
        </div>
      `;
    }

    function printLeaderboard(targetId, dataArray) {
      const el = document.getElementById(targetId);
      el.innerHTML = '';
      if(dataArray.length === 0) {
        el.innerHTML = `<div style="font-size:12px; color:var(--text-muted); padding:10px 0;">Play matches to generate data...</div>`;
        return;
      }
      dataArray.forEach(([key, val]) => {
        el.innerHTML += `<div class="leaderboard-row"><span class="lead-name">${key}</span><span class="lead-val">${val}</span></div>`;
      });
    }
  </script>
</body>
</html>
